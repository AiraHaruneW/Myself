<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Design Gallery</title>
  <style>
    :root {
      --primary-color: #2C3E50;
      --accent-color: #8E1C25;
      --highlight-color: #F1C40F;
      --background-color: #ffffff;
      --text-color: #34495E;
      --hover-color: #3B4A6B;
      --success-color: #A3B18A;
      --alert-color: #D96C4F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      padding: 20px;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 20px;
      color: var(--highlight-color);
      border-bottom: 2px solid var(--hover-color);
      padding-bottom: 5px;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      width: 32px;
      height: 32px;
    }

    .back-button img {
      width: 100%;
      height: auto;
      display: block;
      
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .gallery-item {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      position: relative;
      aspect-ratio: 16 / 9;
      transition: transform 0.4s ease;
    }

    .gallery-item img,
    .gallery-item  {
      width: 100%;
      height: 100%;
      object-fit:cover;
      display: block;
      cursor: pointer;
      transition: transform 0.4s ease;
    }
 video{
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
        transition: transform 0.4s ease;
        object-fit: scale-down;
    }
    .gallery-item:hover img,
    .gallery-item:hover video {
      transform: scale(1.05);
    }
   
   

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
    }

    video:fullscreen,
    video:-webkit-full-screen,
    video:-moz-full-screen {
      aspect-ratio: 9 / 16 !important;
    }
  </style>
</head>
<body>
  <a href="javascript:history.back()" class="back-button">
    <img src="assets/back.png" alt="Back">
  </a>

  <h2>Logos</h2>
  <div class="gallery">
    <div class="gallery-item"><img src="assets/portfolio/coffee/coffee_logo.jpg" alt="Logo 1"></div>
    <div class="gallery-item"><img src="assets/portfolio/skincare_packaging/logo.png" alt="Logo 2"></div>
    <div class="gallery-item"><img src="assets/portfolio/urbanattire/logo.jpeg" alt="Logo 3"></div>
    <div class="gallery-item"><img src="assets/portfolio/wedding/logo.png" alt="Logo 4"></div>
  </div>

  <h2>Posters</h2>
  <div class="gallery">
    <div class="gallery-item"><img src="assets/portfolio/coffee/caffe_poster.jpg" alt="Poster 1"></div>
    <div class="gallery-item"><img src="assets/portfolio/music_concert/poster.png" alt="Poster 2"></div>
    <div class="gallery-item"><img src="assets/portfolio/skincare_packaging/img1.png" alt="Poster 3"></div>
    <div class="gallery-item"><img src="assets/portfolio/wedding/wedding_invitation.jpeg" alt="Poster 4"></div>
  </div>

  <h2>Social Media Designs</h2>
  <div class="gallery">
    <div class="gallery-item"><img src="assets/portfolio/coffee/coffee_banner.png" alt="Social Design 1"></div>
    <div class="gallery-item"><img src="assets/portfolio/music_concert/concert_ticket.svg" alt="Social Design 2"></div>
    <div class="gallery-item"><img src="assets/portfolio/urbanattire/poster.jpeg" alt="Social Design 3"></div>
  </div>

  <h2>Videos</h2>
  <div class="gallery">
    <div class="gallery-item">
      <video controls>
        <source src="assets/new_coffee.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="gallery-item">
      <video controls>
        <source src="assets/music_concert.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="gallery-item">
      <video controls>
        <source src="assets/cream.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="gallery-item">
      <video controls>
        <source src="assets/urbanattire_new.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const images = document.querySelectorAll(".gallery-item img");
      const videos = document.querySelectorAll("video");
      // Smooth fullscreen image
      images.forEach((img) => {
        img.style.transition = "transform 0.4s ease";

        img.addEventListener("click", () => {
          if (img.requestFullscreen) {

            img.requestFullscreen();
          } else if (img.webkitRequestFullscreen) {
            img.webkitRequestFullscreen();
          } else if (img.msRequestFullscreen) {
            img.msRequestFullscreen();
          }
        });

        let startY;
        img.addEventListener("touchstart", (e) => {
          startY = e.touches[0].clientY;
        });

        img.addEventListener("touchend", (e) => {
          const endY = e.changedTouches[0].clientY;
          const deltaY = startY - endY;

          if (deltaY > 50 && document.fullscreenElement === img) {
            if (document.exitFullscreen) {
            
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
              document.msExitFullscreen();
            }
          }
        });
      });

      // Only one video playing at a time
      videos.forEach((video) => {
        video.addEventListener("play", () => {
          videos.forEach((v) => {
            if (v !== video) {
              v.pause();
            }
          });
        });
      });
    });
    document.addEventListener("fullscreenchange", () => {
  const fsElement = document.fullscreenElement;

  // If an image is in fullscreen, change object-fit
  if (fsElement && fsElement.tagName === "IMG") {
    fsElement.style.objectFit = "scale-down";
  } else {
    // Reset object-fit on all images when exiting fullscreen
    document.querySelectorAll(".gallery-item img").forEach(img => {
      img.style.objectFit = "cover";
    });
  }
});

  </script>
</body>
</html>
